# Test databases for ez-migrate integration tests.
# Start: docker compose up -d --wait
# Stop:  docker compose down
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ezmigrate
    ports:
      - "33306:3306"
    tmpfs:
      - /var/lib/mysql
    # MySQL creates its own certificates. The SSL test user is created by the tests
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pezmigrate"]
      interval: 2s
      timeout: 5s
      retries: 60

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ezmigrate
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./tests/fixtures/ssl:/ssl:ro
      - ./tests/fixtures/postgres-init:/docker-entrypoint-initdb.d:ro
    # Postgres needs the key owned by its user, so it is copied before start
    command: >
      sh -c "cp /ssl/server.crt /ssl/server.key /var/lib/postgresql/
      && chown postgres /var/lib/postgresql/server.crt /var/lib/postgresql/server.key
      && chmod 600 /var/lib/postgresql/server.key
      && exec docker-entrypoint.sh postgres -c ssl=on
      -c ssl_cert_file=/var/lib/postgresql/server.crt -c ssl_key_file=/var/lib/postgresql/server.key"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 5s
      retries: 60
