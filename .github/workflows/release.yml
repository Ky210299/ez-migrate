name: Release

# Publishes the package to npm. Two ways to start it:
# - push a tag like v1.2.3 (it must match the version in package.json)
# - run it by hand from the Actions tab (workflow_dispatch) on main: it
#   publishes the version in package.json and then creates the tag v<version>
# Uses npm trusted publishing (OIDC): no npm token is stored in GitHub.
# One-time setup on npmjs.com: package settings > Trusted publisher >
# GitHub Actions, repository Ky210299/ez-migrate, workflow release.yml.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check version and tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
              echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
              exit 1
            fi
          else
            if [ "$GITHUB_REF_NAME" != "main" ]; then
              echo "Run the release from main"
              exit 1
            fi
            if git rev-parse "v$VERSION" >/dev/null 2>&1; then
              echo "Tag v$VERSION already exists. Bump the version in package.json first"
              exit 1
            fi
          fi
      - name: Start test databases
        run: docker compose up -d --wait
      - run: pnpm run lint
      - run: pnpm test
      - name: Publish to npm
        run: npm publish --provenance --access public
      - name: Create the version tag
        if: github.ref_type != 'tag'
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"
